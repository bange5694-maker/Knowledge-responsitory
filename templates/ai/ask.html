{% extends 'share_layout/base.html' %}

{% block content %}
<div class="mx-auto max-w-3xl px-4 py-6 lg:px-6 lg:py-8">
    <div id="ai-ask-page" data-ai-enabled="{% if ai_enabled %}true{% else %}false{% endif %}">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-foreground">AI 站内问答</h1>
            <p class="mt-2 text-sm text-muted-foreground">基于站内已发布文章和已启用评论回答，并标注来源。</p>
        </div>

        {% if ai_enabled %}
            <div class="rounded-xl border border-border bg-card p-4 shadow-sm lg:p-6">
                <div class="mb-4">
                    <p class="mb-2 text-xs font-medium text-muted-foreground">试试这些问题</p>
                    <div class="flex flex-wrap gap-2">
                        <button type="button"
                                data-ai-example="站内有哪些关于 Git 分支的文章？"
                                class="rounded-full border border-border bg-secondary px-3 py-1.5 text-left text-xs text-foreground transition-colors hover:bg-card">
                            站内有哪些关于 Git 分支的文章？
                        </button>
                        <button type="button"
                                data-ai-example="缓存是怎么用的？"
                                class="rounded-full border border-border bg-secondary px-3 py-1.5 text-left text-xs text-foreground transition-colors hover:bg-card">
                            缓存是怎么用的？
                        </button>
                        <button type="button"
                                data-ai-example="评论里大家怎么看？"
                                class="rounded-full border border-border bg-secondary px-3 py-1.5 text-left text-xs text-foreground transition-colors hover:bg-card">
                            评论里大家怎么看？
                        </button>
                    </div>
                </div>

                <div id="ai-qa-messages"
                     class="ai-qa-messages min-h-[8rem] rounded-lg border border-border bg-card p-3 text-sm text-foreground"
                     aria-live="polite"></div>
                <div id="ai-qa-status"
                     class="mt-2 min-h-[1.5rem] text-xs text-muted-foreground"
                     role="status" aria-live="polite"></div>

                <form id="ai-qa-form" class="mt-3 border-t border-border pt-4" hx-boost="false" novalidate>
                    {% csrf_token %}
                    <label for="ai-qa-input" class="sr-only">输入你的问题</label>
                    <textarea id="ai-qa-input" rows="3" maxlength="200" placeholder="输入你的问题…"
                              class="w-full resize-none rounded-lg border border-border bg-card px-3 py-2 text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                    <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
                        <label for="ai-qa-include-comments"
                               class="inline-flex items-center gap-2 text-sm text-muted-foreground">
                            <input type="checkbox" id="ai-qa-include-comments" checked
                                   class="size-4 rounded border-border text-primary focus:ring-primary">
                            包含评论
                        </label>
                        <button type="submit" id="ai-qa-send" disabled
                                class="rounded-lg bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50">
                            发送
                        </button>
                    </div>
                </form>
            </div>
        {% else %}
            <div class="rounded-xl border border-border bg-card p-6 text-sm text-muted-foreground">
                AI 问答暂不可用。
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
